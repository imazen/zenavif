name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger — used when GitHub's pull_request event delivery stalls
  # (observed 2026-07-23: two pushes to an open PR produced no runs; only
  # dispatch fired).
  workflow_dispatch:

concurrency:
  # `github.head_ref` is set ONLY on pull_request events. On a push it is
  # empty, so the group fell through to `github.run_id` — unique per run,
  # so pushes never collided and nothing was ever cancelled. `github.ref`
  # is set on both event types (`refs/heads/main` on push,
  # `refs/pull/N/merge` on a PR), so PR behaviour is unchanged while
  # consecutive pushes to a branch now supersede each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI does not clone the ../codec-corpus sibling; declare it absent so
  # corpus-gated tests skip via the caller (no-graceful-skips policy).
  ZENAVIF_NO_CODEC_CORPUS: "1"
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-26-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v6
        with:
          # zenavif-parse's corpus tests read the av1-avif and link-u
          # submodules fail-loud (same as its pre-absorb CI).
          submodules: recursive
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Some integration tests read libavif vectors fail-loud; the larger
      # ones live outside git, so provision them here (cached per OS).
      - name: Cache test vectors
        id: vectors-cache
        uses: actions/cache@v5
        with:
          path: tests/vectors
          key: avif-test-vectors-${{ hashFiles('scripts/download-avif-test-vectors.sh', 'scripts/download-linku-samples.sh') }}
      - name: Download test vectors
        if: steps.vectors-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash scripts/download-avif-test-vectors.sh
          bash scripts/download-linku-samples.sh
      - name: Test (workspace, default features)
        run: cargo test --workspace
      - name: Test (no default features)
        run: cargo test --no-default-features
      - name: Test zenavif-parse feature permutations
        run: |
          cargo test -p zenavif-parse --features eager
          cargo test -p zenavif-parse --all-features
      # The AV1 backend seams were previously built by NOTHING in CI: neither
      # `zenav1-aom` nor `zenav1-svt` appeared anywhere in this workflow, so
      # tests/product_aom_backend.rs, tests/cross_backend_decode.rs and
      # tests/svt_rs_backend.rs — the cross-backend byte-identity gates, which
      # are the whole point of having two backends — never ran on any platform.
      # Their green results were local-only claims. This runs them.
      #
      # `zenav1-aom-encode` joined the list on 2026-09-02 with the aom encode
      # backend. It is what runs tests/aom_encode_backend.rs, whose mutation
      # proofs (`gate_can_fail_*`) are `#[test]`s and therefore also run here —
      # so CI checks the gate can still FAIL, not just that it passes. Verify
      # the step actually ran by looking for `aom_encode_backend` in this
      # step's log; a feature that silently stops selecting the test would
      # otherwise look identical to a green run.
      #
      # `encode-mono` also joined on 2026-09-02, and it appeared NOWHERE in this
      # workflow before: `encode_gray8` — the true Cs400 monochrome encode path
      # for BOTH the zenravif and zenav1-svt backends, not just the new one —
      # had never been built by any CI job. Adding it here runs 455 tests
      # (up from 448) with no new failures.
      - name: Test (AV1 backend seams — aom decode + svt-rs encode + aom encode)
        run: cargo test --features zenav1-aom,zenav1-aom-encode,encode,encode-imazen,zenav1-svt,target-quality,encode-mono
      - name: Assert the aom encode gate actually ran
        shell: bash
        run: |
          set -euo pipefail
          # Re-run ONLY that test binary and require a non-zero test count.
          # `cargo test --test <name>` fails outright when the target is not
          # selected, and `--format json` would need nightly, so parse the
          # human summary: "test result: ok. N passed" with N > 0.
          out=$(cargo test --features zenav1-aom,zenav1-aom-encode,encode,encode-imazen,zenav1-svt,target-quality,encode-mono --test aom_encode_backend 2>&1 | tee /dev/stderr)
          n=$(printf '%s\n' "$out" | sed -n 's/^test result: ok\. \([0-9][0-9]*\) passed.*/\1/p' | head -1)
          if [ -z "${n:-}" ] || [ "$n" -lt 12 ]; then
            echo "::error::aom_encode_backend reported '${n:-<none>}' passing tests; expected at least 12"
            exit 1
          fi
          echo "aom_encode_backend ran: $n tests passed"
      # The diffmap closed loops were in the same position the backend seams
      # used to be: neither `two-pass-butteraugli` nor `two-pass-zensim`
      # appeared anywhere in this workflow, so tests/two_pass.rs and
      # tests/zensim_loop.rs never ran on any platform. This runs them.
      # `encode-mono` WITHOUT `zenav1-aom-encode` is the build where the gray8
      # feature-off refusal lives (tests/deprecated_backend_aliases.rs
      # `without_zenav1_aom_encode_gray8_names_the_feature`); the seam step
      # above has both features ON, so only this step can observe it.
      - name: Test (diffmap closed loops — butteraugli + zensim)
        run: cargo test --features two-pass-butteraugli,two-pass-zensim,auto-tune,encode-mono
      # Lives HERE and not in `feature-check` because `--lib` includes
      # `decode_av1::tests::{decode_gain_map_from_avif_test_file,
      # raw_obu_422_matches_the_container_path}`, which read
      # `tests/vectors/` fail-loud. Only this job provisions those vectors
      # (the cache + download steps above), so the same command in
      # `feature-check` failed with "No such file or directory ... (run: just
      # download-vectors)" — measured on run 33697870049, not guessed. The
      # `cargo check --features __expert` lines stay in `feature-check`: they
      # compile, they do not run tests, and they need no vectors.
      - name: Test --features __expert (the sweep fingerprint gates)
        run: cargo test --features __expert,encode,encode-imazen,zenav1-svt,zenav1-aom,zenav1-aom-encode --lib

  resolve-standalone:
    # GATE: zenavif must resolve for someone who does NOT run clone-siblings.
    #
    # Every path dependency that escapes this repository's root has to have its
    # manifest loaded during resolution — even when its feature is off — so one
    # such dep makes EVERY cargo command fail in a plain clone. That is what
    # kept `Dependabot Updates` red and what stops zencodecs / zenpipe taking
    # zenavif as a git dependency. The two AV1 backends were the offenders and
    # are now git-rev pins; this job keeps them that way.
    #
    # It clones ONLY ../zenanalyze — the one escaping path dep that is left, and
    # the residual reason a bare clone still cannot resolve. When zenanalyze /
    # zenpredict also stop being path deps, delete the clone step below and this
    # job becomes the full standalone-resolution gate.
    #
    # Proved able to FAIL as well as pass, 2026-09-02, both steps:
    #  * the metadata step — run against the PREVIOUS manifest with the same
    #    siblings absent, `cargo metadata --no-deps` exits non-zero with
    #      error: failed to load manifest for dependency `zenav1-aom-decode`
    #      Caused by: No such file or directory (os error 2)
    #    and against the current manifest it exits 0;
    #  * the absence assertion below — exercised with and without a
    #    `../zenav1-aom` directory present, exiting 1 with the `::error::` line
    #    in the first case and 0 in the second. Checked on bash 3.2, where
    #    `set -euo pipefail` has bitten this program before.
    name: Resolves without the AV1 backend siblings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clone ONLY imazen/zenanalyze into ../zenanalyze
        shell: bash
        run: |
          cd ..
          git clone --depth 1 https://github.com/imazen/zenanalyze.git zenanalyze
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert the AV1 backend siblings are absent
        shell: bash
        run: |
          set -euo pipefail
          for d in ../zenav1-aom ../zenav1-svt; do
            if [ -e "$d" ]; then
              echo "::error::$d exists; this job must run without it or it proves nothing"
              exit 1
            fi
          done
          echo "confirmed absent: ../zenav1-aom ../zenav1-svt"
      - name: cargo metadata --no-deps must succeed
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: cargo metadata (full resolve) must succeed
        run: cargo metadata --format-version 1 > /dev/null

  feature-check:
    name: Feature permutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check default
        run: cargo check
      - name: Check --no-default-features
        run: cargo check --no-default-features
      - name: Check zenavif-parse --features c_api
        run: cargo check -p zenavif-parse --features c_api
      # `__expert` appeared in NO job before 2026-09-02, and it gates
      # `src/sweep.rs`, which carries two EXHAUSTIVE `match config.backend`
      # arms. Adding a variant to `Av1Backend` therefore broke the build for
      # every `__expert` consumer while CI stayed green — measured, not
      # hypothetical: `cargo check --features __expert,encode` failed with two
      # E0004s that no CI job would have reported. These three combinations
      # cover it alone, with the encode backends, and with the expert knobs.
      - name: Check --features __expert (gates src/sweep.rs; was in no job)
        run: |
          cargo check --features __expert,encode
          cargo check --features __expert,encode,zenav1-aom-encode
          cargo check --features __expert,encode,encode-imazen,zenav1-svt,zenav1-aom,zenav1-aom-encode

  wasm:
    name: WASM (wasm32-wasip1, members)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Loading ANY workspace manifest parses the whole workspace, including
      # zenavif's ../ravif and ../zenanalyze path deps — so the siblings are
      # needed even for member-scoped checks.
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-members
      # Preserves the absorbed repos' wasm32-wasip1 check legs, scoped via
      # --manifest-path: a bare `-p zenavif-parse` is ambiguous in this
      # workspace (zenavif-serialize's dev-deps pull registry zenavif-parse
      # 0.6.x alongside the 0.7.0 member).
      - name: Check members on WASM
        run: |
          cargo check --target wasm32-wasip1 --manifest-path zenavif-parse/Cargo.toml
          cargo check --target wasm32-wasip1 --manifest-path zenavif-serialize/Cargo.toml

  i686:
    name: Test (i686 cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686
      # zencodec integration is now always built, so the decode-correctness
      # integration tests (cov_zencodec, color_context_decode) run here too and
      # read downloaded vectors. Provision them (the cross container mounts the
      # workspace, so host-downloaded tests/vectors is visible in-container).
      - name: Cache test vectors
        id: vectors-cache
        uses: actions/cache@v5
        with:
          path: tests/vectors
          key: avif-test-vectors-${{ hashFiles('scripts/download-avif-test-vectors.sh', 'scripts/download-linku-samples.sh') }}
      - name: Download test vectors
        if: steps.vectors-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash scripts/download-avif-test-vectors.sh
          bash scripts/download-linku-samples.sh
      - name: Test (i686)
        # Mount the workspace parent so cross's Docker container can
        # see the cloned ../ravif and ../zenanalyze path-deps. Without
        # this, cargo errors at manifest-load on the missing sources.
        env:
          CROSS_CONTAINER_OPTS: "-v ${{ github.workspace }}/..:${{ github.workspace }}/.."
        run: cross test --target i686-unknown-linux-gnu
      # Scoped via --manifest-path: under cross, a bare `-p zenavif-parse`
      # resolves ambiguously (registry 0.6.x from zenavif-serialize's
      # dev-deps vs the 0.7.0 member).
      - name: Test zenavif-parse (i686, all features)
        env:
          CROSS_CONTAINER_OPTS: "-v ${{ github.workspace }}/..:${{ github.workspace }}/.."
        run: cross test --target i686-unknown-linux-gnu --manifest-path zenavif-parse/Cargo.toml --all-features
      - name: Test zenavif-serialize (i686)
        env:
          CROSS_CONTAINER_OPTS: "-v ${{ github.workspace }}/..:${{ github.workspace }}/.."
        run: cross test --target i686-unknown-linux-gnu --manifest-path zenavif-serialize/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default)
        run: cargo clippy --lib --tests --examples -- -D warnings
      - name: Clippy (members)
        run: |
          cargo clippy -p zenavif-parse --all-features --all-targets -- -D warnings
          cargo clippy -p zenavif-serialize --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt -p zenavif -p zenavif-parse -p zenavif-serialize -- --check
        # `--all` would recurse into the cloned ../zenanalyze path-dep,
        # which has its own fmt-check pipeline. Stay scoped to the workspace.

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo hack check --rust-version --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # llvm-cov runs the integration tests; the now-always-built zencodec
      # decode tests read downloaded vectors, so provision them here too.
      - name: Cache test vectors
        id: vectors-cache
        uses: actions/cache@v5
        with:
          path: tests/vectors
          key: avif-test-vectors-${{ hashFiles('scripts/download-avif-test-vectors.sh', 'scripts/download-linku-samples.sh') }}
      - name: Download test vectors
        if: steps.vectors-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash scripts/download-avif-test-vectors.sh
          bash scripts/download-linku-samples.sh
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  gate-determinism:
    name: Gate A3 (thread-count byte determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Reduced cell grid (incl. the 2.30 MP multi-tile cell); encoded bytes
      # must be identical across thread legs {1,1,8,auto,auto}. The full grid
      # + the other gates are `just gates` (docs/ENGINEERING_BASELINE.md A).
      - name: gate-determinism (--ci subset)
        run: cargo run --release --features encode-imazen,encode-threading --example gate_kit -- determinism --ci
