name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # CI does not clone the ../codec-corpus sibling; declare it absent so
  # corpus-gated tests skip via the caller (no-graceful-skips policy).
  ZENAVIF_NO_CODEC_CORPUS: "1"
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-26-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Some integration tests read libavif vectors fail-loud; the larger
      # ones live outside git, so provision them here (cached per OS).
      - name: Cache test vectors
        id: vectors-cache
        uses: actions/cache@v5
        with:
          path: tests/vectors
          key: avif-test-vectors-${{ hashFiles('scripts/download-avif-test-vectors.sh', 'scripts/download-linku-samples.sh') }}
      - name: Download test vectors
        if: steps.vectors-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash scripts/download-avif-test-vectors.sh
          bash scripts/download-linku-samples.sh
      - name: Test (default features)
        run: cargo test
      - name: Test (no default features)
        run: cargo test --no-default-features
      - name: Test (zencodec feature)
        run: cargo test --features zencodec

  feature-check:
    name: Feature permutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check default
        run: cargo check
      - name: Check --no-default-features
        run: cargo check --no-default-features
      - name: Check --features zencodec
        run: cargo check --features zencodec

  i686:
    name: Test (i686 cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686
      - name: Test (i686)
        # Mount the workspace parent so cross's Docker container can
        # see the cloned ../ravif and ../zenanalyze path-deps. Without
        # this, cargo errors at manifest-load on the missing sources.
        env:
          CROSS_CONTAINER_OPTS: "-v ${{ github.workspace }}/..:${{ github.workspace }}/.."
        run: cross test --target i686-unknown-linux-gnu

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default)
        run: cargo clippy --lib --tests --examples -- -D warnings
      - name: Clippy (zencodec)
        run: cargo clippy --lib --tests --examples --features zencodec -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt -- --check
        # `--all` would recurse into the cloned ../zenanalyze path-dep,
        # which has its own fmt-check pipeline. Stay scoped to zenavif.

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo hack check --rust-version

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
