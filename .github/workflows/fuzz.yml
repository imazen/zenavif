name: Fuzz

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Seconds per fuzz target'
        required: false
        default: '300'

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dir selects the fuzz package (each is its own excluded workspace);
        # dict is the libFuzzer token dictionary for that format's targets.
        # The zenavif-parse rows absorb its pre-merge Fuzz workflow (which
        # never passed its own isobmff.dict — wired up here).
        include:
          - { target: fuzz_decode_animation, dir: fuzz,               dict: fuzz/avif.dict }
          - { target: fuzz_decode_limited,   dir: fuzz,               dict: fuzz/avif.dict }
          - { target: fuzz_decode,           dir: fuzz,               dict: fuzz/avif.dict }
          - { target: fuzz_probe,            dir: fuzz,               dict: fuzz/avif.dict }
          - { target: fuzz_parse,            dir: zenavif-parse/fuzz, dict: zenavif-parse/fuzz/isobmff.dict }
          - { target: fuzz_parse_limited,    dir: zenavif-parse/fuzz, dict: zenavif-parse/fuzz/isobmff.dict }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          cache-directories: ${{ matrix.dir }}/target

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Determine duration
        id: duration
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=300" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seconds=${{ github.event.inputs.duration || '300' }}" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=60" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed corpus
        run: |
          mkdir -p ${{ matrix.dir }}/corpus/${{ matrix.target }}
          cp ${{ matrix.dir }}/regression/* ${{ matrix.dir }}/corpus/${{ matrix.target }}/ 2>/dev/null || true
          cp ${{ matrix.dir }}/seed_corpus/${{ matrix.target }}/* ${{ matrix.dir }}/corpus/${{ matrix.target }}/ 2>/dev/null || true

      - name: Fuzz ${{ matrix.target }}
        run: |
          cargo +nightly fuzz run --fuzz-dir ${{ matrix.dir }} --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            -- -max_total_time=${{ steps.duration.outputs.seconds }} \
               -dict=${{ matrix.dict }} \
               -rss_limit_mb=2048

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: ${{ matrix.dir }}/artifacts/
          retention-days: 30

  regression:
    name: Fuzz regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clone-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Regression seeds (zenavif)
        run: |
          if [ -d fuzz/regression ] && [ "$(ls fuzz/regression/ 2>/dev/null | wc -l)" -gt 0 ]; then
            cargo test -p zenavif --test fuzz_regression
          fi
      - name: Regression seeds (zenavif-parse)
        run: |
          if [ -d zenavif-parse/fuzz/regression ] && [ "$(ls zenavif-parse/fuzz/regression/ 2>/dev/null | wc -l)" -gt 0 ]; then
            cargo test -p zenavif-parse --test fuzz_regression
          fi
