name: Clone path-dep sibling (zenanalyze)
description: |
  zenavif's Cargo.toml still has path deps on imazen/zenanalyze for
  the optional `auto-tune` feature plus the dev-dep used by
  `examples/extract_features.rs`. Cargo resolves path-deps at
  manifest-parse time, so the directory must exist even when the
  feature is off — clone the sibling here.

  (cavif-rs clone removed: zenravif 0.1.3 is on crates.io as of
  2026-05-02, and the [patch.crates-io] override in zenavif's
  Cargo.toml has been dropped.)

runs:
  using: composite
  steps:
    - name: Clone imazen/zenanalyze into ../zenanalyze
      shell: bash
      run: |
        cd ..
        if [ ! -d zenanalyze ]; then
          git clone --depth 1 https://github.com/imazen/zenanalyze.git
        fi
