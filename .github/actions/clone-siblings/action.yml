name: Clone path-dep siblings (zenanalyze, ravif)
description: |
  zenavif's Cargo.toml has path deps that Cargo resolves at manifest-parse
  time, so the directories must exist even when the owning feature is off:
    - imazen/zenanalyze   → ../zenanalyze (optional `auto-tune` + an example dev-dep)
    - imazen/cavif-rs     → ../ravif      (the `zenravif` 0.2.0 encoder, behind `encode`)

  The `ravif`/`zenravif` path dep points at 0.2.0, which is unpublished (crates.io
  has only 0.1.3), so the sibling must be cloned. Drop this step + switch
  Cargo.toml back to a registry dep once zenravif 0.2.0 is published.
  (zencodec resolves from the registry at 0.1.26, and zenavif-parse is a
  hermetic git-rev [patch.crates-io] pin until 0.7.0 ships — neither needs a
  sibling clone.)

runs:
  using: composite
  steps:
    - name: Clone imazen/zenanalyze into ../zenanalyze
      shell: bash
      run: |
        cd ..
        if [ ! -d zenanalyze ]; then
          git clone --depth 1 https://github.com/imazen/zenanalyze.git
        fi
    - name: Clone imazen/cavif-rs into ../ravif
      shell: bash
      run: |
        cd ..
        if [ ! -d ravif ]; then
          git clone --depth 1 https://github.com/imazen/cavif-rs.git ravif
        fi
    - name: Clone imazen/zenav1-svt into ../zenav1-svt
      shell: bash
      run: |
        cd ..
        if [ ! -d zenav1-svt ]; then
          # NO --recurse-submodules on purpose: the repo's reference/svt-av1
          # submodule is the C differential oracle, a dev-only dependency of
          # that repo's own harnesses. The pure-Rust `zenav1-svt*` crates this
          # crate depends on never reference it, and cloning it would pull
          # the whole SVT-AV1 C tree onto every CI job.
          git clone --depth 1 https://github.com/imazen/zenav1-svt.git
        fi
    - name: Clone imazen/zenav1-aom into ../zenav1-aom
      shell: bash
      run: |
        cd ..
        if [ ! -d zenav1-aom ]; then
          git clone --depth 1 https://github.com/imazen/zenav1-aom.git
        fi
