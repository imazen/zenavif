name: Clone path-dep siblings (zenanalyze, ravif, zenrav1e, zensim)
description: |
  zenavif's Cargo.toml has path deps that Cargo resolves at manifest-parse
  time, so the directories must exist even when the owning feature is off:
    - imazen/zenanalyze   → ../zenanalyze (optional `auto-tune` + an example dev-dep)
    - imazen/cavif-rs     → ../ravif      (the `zenravif` 0.2.0 encoder, behind `encode`)
    - imazen/zenrav1e     → ../zenrav1e   (TRANSITIVE: cavif-rs master's zenravif
                                           now path-deps `../../zenrav1e` — resolving
                                           to this checkout's sibling — instead of the
                                           registry 0.1.4; without the clone every job
                                           dies at manifest parse, which is exactly how
                                           CI has been red since that cavif-rs push)
    - imazen/zensim       → ../zensim     (dev-dep for the zensim_cq_rd loop
                                           harness; needs the unpublished 0.3.0
                                           surface — profile C + folded-944)

  NOT cloned any more (2026-09-02): `imazen/zenav1-aom` and `imazen/zenav1-svt`.
  Both AV1 backends moved from sibling path deps to git-rev pins in Cargo.toml,
  so cargo fetches them itself and a clone here would be dead weight. Cargo does
  recurse their submodules where this action deliberately did not, which costs
  roughly 250 MB (libaom-mirror) + 85 MB (zenav1-svt-c) of git db plus ~420 MB of
  checkouts on a COLD `Swatinem/rust-cache` — measured 2026-09-02, and in the
  same order as the `rav1d-safe` (396 MB) and `aom` (403 MB) git deps this graph
  already carries. It buys back standalone resolution (see the
  `resolve-standalone` job in ci.yml) and stops the seam building against a
  dirty sibling working copy.

  The `ravif`/`zenravif` path dep points at 0.2.0, which is unpublished (crates.io
  has only 0.1.3), so the sibling must be cloned. Drop this step + switch
  Cargo.toml back to a registry dep once zenravif 0.2.0 is published; same for
  the zensim dev-dep once zensim 0.3.0 ships, and for zenrav1e once cavif-rs
  master returns to a registry dep (the post-0.1.4 publish).
  (zencodec resolves from the registry at 0.1.26, and zenavif-parse is a
  hermetic git-rev [patch.crates-io] pin until 0.7.0 ships — neither needs a
  sibling clone.)

runs:
  using: composite
  steps:
    # Every clone below goes through `clone_retry`, defined here once and
    # re-sourced per step (composite steps do not share a shell). GitHub's
    # runners intermittently fail these with TLS errors — observed 2026-08-11
    # on macos-latest ("SSL certificate problem: self signed certificate",
    # run 31526664042) and on the i686 job ("server certificate verification
    # failed. CAfile: none", run 31533672988), both while cloning a sibling
    # that had cloned fine minutes earlier. A single failure here kills the
    # whole job before any test runs, so it is worth three tries.
    - name: Define the retrying clone helper
      shell: bash
      run: |
        cat > "${RUNNER_TEMP}/clone_retry.sh" <<'HELPER'
        clone_retry() {
          url="$1"; dest="$2"
          [ -d "$dest" ] && return 0
          for attempt in 1 2 3; do
            if git clone --depth 1 "$url" "$dest"; then
              return 0
            fi
            echo "clone of $url failed (attempt $attempt/3); retrying in $((attempt * 5))s" >&2
            rm -rf "$dest"
            sleep $((attempt * 5))
          done
          echo "clone of $url failed after 3 attempts" >&2
          return 1
        }
        HELPER
    - name: Clone imazen/zenanalyze into ../zenanalyze
      shell: bash
      run: |
        cd ..
        . "${RUNNER_TEMP}/clone_retry.sh"
        clone_retry https://github.com/imazen/zenanalyze.git zenanalyze
    - name: Clone imazen/cavif-rs into ../ravif
      shell: bash
      run: |
        cd ..
        . "${RUNNER_TEMP}/clone_retry.sh"
        clone_retry https://github.com/imazen/cavif-rs.git ravif
    - name: Clone imazen/zenrav1e into ../zenrav1e
      shell: bash
      run: |
        cd ..
        . "${RUNNER_TEMP}/clone_retry.sh"
        clone_retry https://github.com/imazen/zenrav1e.git zenrav1e
    - name: Clone imazen/zensim into ../zensim
      shell: bash
      run: |
        cd ..
        . "${RUNNER_TEMP}/clone_retry.sh"
        clone_retry https://github.com/imazen/zensim.git zensim
