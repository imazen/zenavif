[package]
name = "zenmp4-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
zencodec = { version = ">=0.2.0, <0.4.0", default-features = false }
zenmp4 = { path = ".." }
zencodec-media = { git = "https://github.com/imazen/zencodec", rev = "41b1357e9bec50fb1c9508a310ba4b601605207b" }
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "41b1357e9bec50fb1c9508a310ba4b601605207b" }

[patch.crates-io]
# Keep standalone consumers on the same optional-control family.
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "41b1357e9bec50fb1c9508a310ba4b601605207b" }
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "41b1357e9bec50fb1c9508a310ba4b601605207b" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "41b1357e9bec50fb1c9508a310ba4b601605207b" }
zencodec-media = { git = "https://github.com/imazen/zencodec", rev = "41b1357e9bec50fb1c9508a310ba4b601605207b" }
zencodec-media-testkit = { git = "https://github.com/imazen/zencodec", rev = "41b1357e9bec50fb1c9508a310ba4b601605207b" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "41b1357e9bec50fb1c9508a310ba4b601605207b" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "41b1357e9bec50fb1c9508a310ba4b601605207b" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }

[[bin]]
name = "fuzz_mp4"
path = "fuzz_targets/fuzz_mp4.rs"
test = false
doc = false
bench = false
