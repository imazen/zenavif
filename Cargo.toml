[patch.crates-io]
# The zenanalyze-api additions this crate's graph needs (FeatureProvider,
# Select::Names) are on `main` but not yet on crates.io. ONE patch, here at the
# workspace root, rewrites every registry edge — including the ones inside
# zenpicker / zenpredict — so the whole graph resolves a single zenanalyze-api
# and `Offer` typechecks across the picker boundary. Never re-pin this as a
# per-manifest git rev: that is what split the ecosystem before. Drop the entry
# at the zenanalyze-api 0.1.1 publish.
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze" }
# Workspace member supplies zenavif-serialize 0.2.0 (set_gain_map_alt_icc) to
# this crate's own registry requirements (the optional `encode-svt-rs` dep and
# the dev-dep) — 0.2.0 is unpublished. Drop at the zenavif-serialize 0.2.0
# publish.
zenavif-serialize = { path = "zenavif-serialize" }

# zenravif (git-rev dep above) takes zenavif-serialize 0.2.0 from the archived
# standalone repo as a git dep of its own (since cavif-rs 2026-08-27, so that
# its git consumers need no patch). Unify that source to the same workspace
# member, or `encode` + tests/`encode-svt-rs` builds would carry two
# zenavif-serialize 0.2.0 packages. Cargo reports this entry unused (a
# warning, not an error) in builds without `encode`. Drop at the publish.
[patch."https://github.com/imazen/zenavif-serialize"]
zenavif-serialize = { path = "zenavif-serialize" }
# (The former TEMP rav1d-safe [patch.crates-io] pin at f6aed27e is gone:
# the dependency itself is now a git dep at 398b0bfa — a 0.6.0-staged rev
# that carries the zenavif#30 wedge fix and the #14 aarch64 SGR fix, and
# which a crates-io patch could not supply because 0.6.0 cannot patch a
# 0.5.x requirement. Return to a registry dep at the 0.6.0 release;
# fuzz/Cargo.toml mirrors the same pin.)

[[bench]]
name = "unpremul_tiers"
harness = false
required-features = ["_dev"]

[[example]]
name = "cancel_latency"
required-features = ["encode"]

# line-tables-only: file:line resolution for the per-site allocation profiler
# (examples/mem_probe_encode.rs, JXL_ALLOC_SITES=1).
[profile.release]
debug = "line-tables-only"
