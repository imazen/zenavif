[package]
name = "zenavif"
version = "0.1.7"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "Pure Rust AVIF image codec powered by rav1d and zenravif"
categories = ["multimedia::images"]
keywords = ["avif", "decoder", "encoder", "av1", "image"]
repository = "https://github.com/imazen/zenavif"
documentation = "https://docs.rs/zenavif"
include = ["/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE*", "/tests/**/*.rs", "/benches/**", "/examples/**"]

# Lives in tests-dev/ (outside the `include` whitelist) so the published
# crate ships neither the test nor its cargo-public-api/nightly-rustdoc
# requirement; cargo strips this target from the packaged manifest.
[[test]]
name = "public_api_doc"
path = "tests-dev/public_api_doc.rs"

[dependencies]
# rav1d: C FFI-based decoder for asm feature (fastest)
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"], optional = true }
# rav1d-safe: 100% safe managed API decoder (no c-ffi feature!)
rav1d-safe = { version = "0.5.3", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
archmage = { version = "0.9.15", features = ["macros"] }
magetypes = { version = "0.9.15"}
safe_unaligned_simd = "0.2.5"
zenavif-parse = "0.6.0"
yuv = "0.8.12"
imgref = "1.12.0"
rgb = { version = "0.8.52", default-features = false, features = ["bytemuck"] }
enough = "0.4.3"
bytemuck = { version = "1.25.0", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.18", default-features = false }
whereat = { version = "0.1.5"}
log = "0.4.29"
ravif = { package = "zenravif", version = "0.1.3", default-features = false, optional = true, features = ["stop"] }
# Optional auto-tune deps — gated on `auto-tune` feature, off by default.
# Path-pinned to the sibling checkout (CI clones ../zenanalyze); reqs track the
# sibling's 0.2.0 — crates.io still has 0.1.0/0.1.x, so a registry release of
# zenavif needs zenanalyze/zenpredict published first.
zenpredict = { version = "0.2.0", path = "../zenanalyze/zenpredict", optional = true }
zenanalyze = { version = "0.2.0", path = "../zenanalyze", optional = true, features = ["experimental"] }
serde_json = { version = "1.0", default-features = false, features = ["std"], optional = true }
almost-enough = { version = "0.4.3", default-features = false }
zencodec = { version = "0.1.21", optional = true }
# Gain-map application math for GainMapRender::ReconstructHdr (decode-side
# HDR reconstruction). Pure math, no codec engines.
ultrahdr-core = { version = "0.5.0", default-features = false, optional = true }
# zennode = { path = "../zennode/zennode", optional = true, default-features = false, features = ["derive"] }
zenpixels = { version = "0.2.11", default-features = false, features = ["imgref", "rgb"] }
zenpixels-convert = { version = "0.2.13", default-features = false, features = ["rgb"] }
linear-srgb = { version = "0.6.7"}

[dev-dependencies]
almost-enough = { version = "0.4.3", features = ["alloc"] }
zenutils-fuzz = "0.1.0"
archmage = { version = "0.9.15", features = ["std"] }
env_logger = { version = "0.11.10", default-features = false }
png = "0.18.0"
image = "0.25.10"
zenbench = { version = "0.1.2", features = ["criterion-compat"] }
fast-ssim2 = { version = "0.8.0"}
zensim = { version = "0.2.4", features = ["imgref", "zenpixels"] }
zensim-regress = { version = "0.3.0"}
rayon = "1.11.0"
# Feature extraction for the rav1e knob predictor MLP training.
# Path-pinned to the sibling checkout (see the [dependencies] note above);
# test-only dep for the rav1e picker training.
zenanalyze = { version = "0.2.0", path = "../zenanalyze", features = ["experimental"] }
# Parses `cargo metadata` in tests/public_api_doc.rs (feature-list discovery).
serde_json = "1.0.150"

[[bench]]
name = "decode_benchmark"
harness = false

[[bench]]
name = "yuv_conversion_benchmark"
harness = false
required-features = ["_dev"]

[[bench]]
name = "yuv_crate_comparison"
harness = false
required-features = ["_dev"]

[[example]]
name = "mono_encode_ab"
required-features = ["encode-imazen"]

[[example]]
name = "lossless_speed_sweep"
required-features = ["encode-imazen"]

[[example]]
name = "accuracy_check"
required-features = ["_dev"]

[[example]]
name = "benchmark_autovec"
required-features = ["_dev"]

[[example]]
name = "benchmark_simd"
required-features = ["_dev"]

[[example]]
name = "debug_accuracy"
required-features = ["_dev"]

[[example]]
name = "debug_yuv_bilinear"
required-features = ["_dev"]

[[example]]
name = "libyuv_benchmark"
required-features = ["_dev"]

[[example]]
name = "test_yuv_bilinear"
required-features = ["_dev"]

[[example]]
name = "verify_yuv_formula"
required-features = ["_dev"]

[[example]]
name = "yuv_benchmark"
required-features = ["_dev"]

[[example]]
name = "yuv_profile"
required-features = ["_dev"]

[[example]]
name = "encode_sweep"
required-features = ["encode-imazen", "encode-threading"]

[[example]]
name = "sweep_validate"
required-features = ["__expert"]

[[example]]
name = "predictor_sweep"
required-features = ["__expert"]

[[example]]
name = "phase2_oat"
required-features = ["__expert"]

[[example]]
name = "auto_tune_smoke"
required-features = ["auto-tune"]

[features]
default = []
# Decode with hand-written assembly via C FFI (fastest, uses unsafe)
unsafe-asm = ["dep:rav1d", "rav1d/asm"]
# AVIF encoding via zenravif (pure Rust by default)
encode = ["dep:ravif"]
# Encoding with hand-written assembly (fastest, uses unsafe)
encode-asm = ["encode", "ravif/asm"]
# Encoding with multi-threading
encode-threading = ["encode", "ravif/threading"]
# Encoding with imazen/zenrav1e fork features (QM, VAQ, still-image tuning, lossless)
encode-imazen = ["encode", "ravif/imazen"]
# Expert / unstable: exposes `InternalParams` for codec calibration sweeps
# + the rav1e knob predictor MLP training pipeline. Double-underscore prefix
# signals "private — do not depend on this in production code." Anything
# in the `expert` module may change without semver bumps. Pulls zenravif's
# `__expert` feature for the underlying speed-preset overrides.
__expert = ["encode-imazen", "ravif/__expert"]
# Auto-tune via the rav1e knob predictor MLP. Includes a baked ZNPR
# model + zenanalyze feature extractor; adds ~30 KB to the binary.
# See docs/RAV1E_PICKER_PLAN.md for the training pipeline.
auto-tune = ["encode-imazen", "dep:zenpredict", "dep:zenanalyze", "dep:serde_json"]
# Enable zencodec trait integration
zencodec = ["dep:zencodec", "zenavif-parse/zencodec", "dep:ultrahdr-core"]
# Enable zennode pipeline node definitions
# zennode = ["dep:zennode"]
# Expose internal YUV conversion modules for profiling/debugging. Not public API.
_dev = []

[profile.test]
opt-level = 2

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition"]