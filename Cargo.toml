[package]
name = "zenavif"
version = "0.1.7"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
description = "Pure Rust AVIF image codec powered by rav1d and zenravif"
categories = ["multimedia::images"]
keywords = ["avif", "decoder", "encoder", "av1", "image"]
repository = "https://github.com/imazen/zenavif"
documentation = "https://docs.rs/zenavif"
readme = "README.crates.md"
include = ["/src/**", "/README.crates.md", "/CHANGELOG.md", "/LICENSE*", "/tests/**/*.rs", "/benches/**", "/examples/**"]

# Workspace: zenavif (this root package) + the absorbed container crates.
# The fuzz packages and apidoc snapshot runners stay out via their own
# [workspace] tables (self-exclusion is REQUIRED for zenavif-parse/fuzz:
# root `exclude` does not reach a package nested inside a member directory);
# the exclude entries below are documentation + glob-safety only.
[workspace]
members = ["zenavif-parse", "zenavif-serialize"]
exclude = ["fuzz", "zenavif-parse/fuzz"]
resolver = "3"

[dependencies]
# rav1d: C FFI-based decoder for asm feature (fastest)
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"], optional = true }
# rav1d-safe: 100% safe managed API decoder (no c-ffi feature!)
# Git-rev pinned to imazen/rav1d-safe main (0.6.0 staged). Return to a
# registry dep at the 0.6.0 release.
#
# Carries, in the order they were found:
#  * #445 — strided block guards reserved inter-row gaps that neighbouring
#    tiles legitimately write, so a 4K decode at threads>=2 failed outright
#    and in-flight cancellation could not be exercised multi-threaded.
#  * rav1d-safe@49df1fc0 — the tile-threading CDEF/loop-filter race and the
#    panic-wedge behind it (zenavif#30): a dead tile worker used to wedge
#    `rav1d_decode_frame`'s completion wait forever.
#  * rav1d-safe@f9458f43 — exact-window cdef padding guards, NON-SIMD paths.
#  * rav1d-safe@fdd6a35 — the same fix for the SIMD kernels, which f9458f43
#    did NOT cover. This is why the bump past a6a7e232 matters on aarch64:
#    the old rev over-reserved the unread `0..x_start` prefix of each cdef
#    padding row, and under load that produced a FALSE DisjointMut overlap
#    (`& _[5150..5162]` vs `&mut _[4896..5152]`, 2 bytes, both inside the
#    over-reserved prefix) in `safe_simd/cdef_arm.rs`. The wedge fix above
#    turned it into a fast error rather than a hang, but the decode still
#    FAILED: intermittent `Decode { code: -1 }` on ~2 of 15 full-suite runs
#    (rav1d-safe#449). Narrowing a read reservation to what is actually read
#    cannot mask a real overlap, so this removes false positives only.
#  * the tile-threading correctness + granularity campaign (rav1d-safe#455):
#    the 766-vector corpus now passes at t=1 AND t=8 with nothing skipped.
#
#  * rav1d-safe@3426ebf7 — rav1d-safe#524, the intermittent
#    `cov_zencodec::row_sink_decode_is_byte_identical_to_buffered_decode`
#    failure on ubuntu-latest (`& _[73721..73729]` vs
#    `&mut _[73728..74112]`). **This entry's earlier text was a WRONG
#    diagnosis** — it read the panic as another fdd6a35-shaped false positive
#    ("reserves an 8-byte window where the filter reads 7 taps"). It was not.
#    The guard was HONEST: the 8bpc x86_64 H kernels genuinely load all 8
#    bytes. `loop_filter_4_8bpc_wd6_simd_h`'s `load_row_hi` pulls a 4-byte
#    chunk at `+1` and `..._wd16_simd_h`'s `load_chunk(_, 5)` pulls one at
#    `+5`, but only lanes 0/1 of each survive `transpose4` (`hi[2..4]`,
#    `c3[2..4]` are never bound) — so the trailing lanes were read and thrown
#    away, and narrowing the guard alone would have made it lie. A second
#    defect compounded it: the H window was sized from the PLANE's worst case
#    ((3,5) chroma / (7,9) luma) instead of from the run's mask
#    (`lf_run_reach`). `default_picture_alloc` pads a stride only when it is a
#    multiple of 1024, so a 768-wide 4:2:0 frame's chroma plane (stride 384 =
#    its width) gets no padding at all, and at the last 4-column group
#    `edge + 5` is the FIRST PIXEL OF THE NEXT PICTURE ROW — which
#    `owned_recon::stitch_sbrow` legitimately holds `&mut` over while
#    reconstructing the next superblock row. Hence one shared index at t > 1.
#    Fix: both kernels now load only the bytes they consume (dead lanes
#    zero-filled, bit-identical by construction because `transpose4`'s outputs
#    0 and 1 depend only on input lanes 0 and 1), and both dispatchers size the
#    H window from `lf_run_reach` through one `lf_compact_window`. The
#    SIMD-vs-scalar fallback predicate deliberately keeps its old 9/5 values,
#    so the SIMD/scalar decision — and therefore every output byte — is
#    unchanged by the fix.
#
# Also new in this bump (140f9145 -> 66f58fa6, ~96 commits), both of which
# zenavif's decode paths sit on top of:
#  * rav1d-safe@2e0f7e8 — `Settings::strictness`, defaulting to
#    `Strictness::Strict`. `Settings::default()` (which is what every zenavif
#    decode path uses) now REJECTS what libaom rejects — dav1d's
#    strict_std_compliance checks plus the AV1 6.10.8 segment_id bound — as
#    `Error::InvalidData` instead of concealing it. `strict_std_compliance` is
#    deprecated but still honoured (the stricter of the two wins), and zenavif
#    never sets it. Upstream surveyed 315 AVIFs/OBUs from codec-corpus +
#    zenavif/tests: identical verdicts except a deliberately corrupted vector.
#  * rav1d-safe@59eb17b — `Decoder::flush()` now DRAINS the frames it still
#    owes before it resets, instead of resetting first and discarding them
#    (rav1d-safe#423). zenavif calls `flush()` at end of input in
#    `decode_av1.rs` and `decoder_managed/decoder.rs`.
rav1d-safe = { git = "https://github.com/imazen/rav1d-safe", rev = "66f58fa6a64c689998721cc5cdb16a4698e26eec", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# zenav1-aom pure-Rust AV1 KEY-frame decoder — second decode backend (feature
# `aom-backend`). Git-rev pinned to imazen/zenav1-aom main (crate unpublished;
# intra decode is conformance-clean vs libaom v3.14.1 at this rev). This rev
# carries the structured `DecodeError` + `DecodeConfig` (limits/stop/alloc)
# API and the bd8 lowbd perf pipeline (4K vs C 1.45x -> 1.286x upstream).
# 2026-08-06: sibling path dep for the same reason as `svtav1` below — the
# decode-backend work and the in-repo zenav1-aom work land together, so a
# publish/rev round-trip between them would serialize the whole program.
# Return to a git-rev pin on `imazen/zenav1-aom` before this branch lands.
aom-decode = { package = "zenav1-aom-decode", path = "../zenav1-aom/crates/aom-decode", optional = true }
archmage = { version = "0.9.15", features = ["macros", "avx512"] }
magetypes = { version = "0.9.15"}
safe_unaligned_simd = "0.2.5"
# 0.7.0 (breaking): parser entry points return `whereat::At<Error>`, and `Error`
# impls `zencodec::CategorizedError` (delegated from this crate's `Error::Parse`).
# Workspace member (absorbed 2026-07-16); the path supplies 0.7.0 until it is
# published, after which registry consumers resolve it normally.
zenavif-parse = { version = "0.7.0", path = "zenavif-parse" }
yuv = "0.8.12"
imgref = "1.12.0"
rgb = { version = "0.8.52", default-features = false, features = ["bytemuck"] }
enough = "0.4.3"
bytemuck = { version = "1.25.0", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.18", default-features = false }
whereat = { version = "0.1.5"}
log = "0.4.29"
# zenravif 0.2.0 is unpublished (crates.io tops out at 0.1.3), so it is a
# git-rev pin on imazen/cavif-rs main. It WAS the sibling path `../ravif/ravif`
# until 2026-08-27; a path that escapes this repo is unresolvable for anyone
# taking zenavif from git (zencodecs / zenpipe patch `zenavif = { git = … }`,
# and their CI had failed at resolution since 2026-08-01). At this rev
# zenravif's own unpublished deps are git-rev pins too — zenrav1e 0.2.0 (was
# path-only) and zenavif-serialize 0.2.0 (was a root [patch] that no consumer
# inherited) — so the whole `encode` chain resolves from bare checkouts with no
# consumer-side patch. Bump `rev` when a newer zenravif is needed; for
# sibling-lockstep work add an uncommitted
# `[patch."https://github.com/imazen/cavif-rs"] zenravif = { path = "../ravif/ravif" }`.
# The [patch."…/zenavif-serialize"] below folds zenravif's copy onto this
# workspace's member.
ravif = { package = "zenravif", version = "0.2.0", git = "https://github.com/imazen/cavif-rs", rev = "f6c883b6e7395fad67c87ddab676c4df59575a41", default-features = false, optional = true, features = ["stop"] }
# svtav1-rs experimental AV1 encode backend (`encode-svt-rs` feature).
# The facade crate lives in the rust/svtav1 subdir of imazen/zenav1-svt and is
# PACKAGED as `zenav1-svt`; the `svtav1` alias keeps the seam's `use` paths
# stable (it was named `svtav1` upstream once).
#
# 2026-08-06: switched from a git-rev pin to the sibling path dep. The old pin
# (`github.com/imazen/svtav1` @ 2d585bb2b) is UNFETCHABLE: the repo was renamed
# to `imazen/zenav1-svt` and its `reference/svt-av1` submodule URL moved to
# `imazen/zenav1-svt-c`, so cargo's submodule update 404s on the old
# `imazen/svt-av1-ref` and the whole dependency resolution fails — for every
# feature combination, not just `encode-svt-rs`. A path dep also composes the
# in-flight zenav1-svt work with this crate's without a publish round-trip, per
# the CLAUDE.md unpublished-dependency rule. CI clones the sibling from
# `origin/main` (`.github/actions/clone-siblings`), so the seam always builds
# against pushed upstream `main` — there is no rev to bump, and upstream
# movement reaches CI the moment it is pushed. Return to a git-rev pin on
# `imazen/zenav1-svt` before this branch lands.
#
# What the seam consumes from that tree:
#   * the fallible entry points — `try_encode_frame*` -> `EncodeResult<Vec<u8>>`
#     with a typed `EncodeError` (Cancelled / AllocFailed / InvalidDimensions /
#     UnsupportedConfig), `with_stop` / `with_thread_count`, `fallible-alloc`;
#   * native 10-bit `try_encode_frame_420_hbd`, with hbd chunks 1+2
#     (`35743ebd5`, `f319ec298`) so the post-filter searches read real u16;
#   * partial superblocks at EVERY preset on the 4:2:0 colour path
#     (`partial_sb_gate` gained a presets-0-5 block 2026-08-04).
#
# 2026-08-29 — TWO UPSTREAM SHAPES CHANGED HERE, both handled in-tree:
#   1. Crate consolidation 6 -> 4 (`bfae1b690`, fixes zenav1-svt#3):
#      `zenav1-svt-tables` folded into `zenav1-svt-types` as
#      `svtav1_types::tables`, `zenav1-svt-entropy` into `zenav1-svt-encoder`
#      as `svtav1_encoder::entropy`. The facade keeps `svtav1::tables` /
#      `svtav1::entropy` as re-exports, so THIS crate needed no `use` path
#      changes — only the lockfile collapsed. Verified by building the full
#      `aom-backend,encode,encode-imazen,encode-svt-rs,target-quality` set.
#   2. QP 0 / coded-lossless is IMPLEMENTED, not refused (`75cf7b0f7` +
#      `129d45494`, zenav1-svt#5/#9). The seam's quality->QP clamp stays (see
#      `quality_to_qp_gated`), but the gate that asserted the refusal was
#      replaced with a lossless round-trip gate — see CLAUDE.md Known Bugs.
svtav1 = { package = "zenav1-svt", path = "../zenav1-svt/rust/svtav1", optional = true }
# AVIF container muxer for the svtav1-rs backend (the zenravif backend muxes
# inside zenravif; this backend muxes in-crate). The 0.2.0 version is
# supplied by the [patch.crates-io] git pin below until 0.2.0 publishes.
zenavif-serialize = { version = "0.2.0", optional = true }
# Optional target-quality deps — encode->decode->score convergence loop
# (`target-quality` feature). Same versions as the dev-dependency copies.
fast-ssim2 = { version = "0.8.0", optional = true, features = ["imgref", "rayon"] }
# zensim: git-pinned to `main` (0.3.0, unpublished) for the diffmap API the
# `two-pass-zensim` closed loop needs — `Zensim::compute_with_ref_and_diffmap`
# + `PrecomputedReference` reuse + `Zensim::with_stop`. 0.3.0 is a breaking 0.x
# bump over the registry's 0.2.4, so the pin covers the whole graph (the
# dev-dependency copy below matches). Return to a registry version at the
# zensim 0.3.0 publish.
#
# `feature-regime-v2` + `custom-profiles` carry the generation-C surface
# (`src/zensim_c.rs`): the folded-944 extraction `C` actually consumes
# (`compute_folded720_features_streaming`, feature-regime-v2) and the
# attribution-density steering map + `Fused944Session`, whose module is
# gated on `custom-profiles` and whose fused entry needs BOTH. Neither
# feature changes the v1 372-feature extraction that profile `B` scores
# through, so `TargetMetric::Zensim` is byte-unaffected.
zensim = { git = "https://github.com/imazen/zensim", branch = "main", optional = true, features = ["imgref", "zenpixels", "feature-regime-v2", "custom-profiles"] }
# Optional two-pass diffmap dep — butteraugli per-pixel error map drives the
# per-SB quantizer-scale second pass (`two-pass-butteraugli` feature).
butteraugli = { version = "0.9.3", optional = true }
# Optional auto-tune deps — gated on `auto-tune` feature, off by default.
# Path-pinned to the sibling checkout (CI clones ../zenanalyze); reqs track the
# sibling's 0.2.0 — crates.io still has 0.1.0/0.1.x, so a registry release of
# zenavif needs zenanalyze/zenpredict published first.
zenpredict = { version = "0.2.0", path = "../zenanalyze/zenpredict", optional = true }
zenanalyze = { version = "0.2.0", path = "../zenanalyze", optional = true, features = ["experimental"] }
# zenanalyze-api: the zero-dep, version-unifying feature contract (Request /
# Offer / FeatureProvider) the auto-tuner negotiates a shared feature pass with,
# and this crate's INTERCHANGE BOUNDARY — so a host on any zenanalyze version can
# hand us an Offer. The `zenanalyze` dep above sits alongside it deliberately and
# is explicitly PERMITTED (owner, 2026-08-28: "a direct dep is okay though, a
# reanalysis might be needed anyway if the upstream provided features are
# insufficient") — auto_tune, palette_gate, fast_heads and q0_head all fall back
# to their own pass when the offer misses. See `docs/sole-contract.md` in
# imazen/zenanalyze.
#
# Declared as a crates.io VERSION. It used to be a git-rev pin, on the theory
# that pinning every codec to the SAME rev keeps the type unified — but that is
# fragile in the wrong direction: zenjpeg carried the same rev, zensquoosh a
# different one (7b84d53c), and zenpipe/zencodecs the floating registry+patch
# form, so a graph combining them resolved THREE sources of zenanalyze-api and
# the `Offer` types did not interconvert (zenpipe hit exactly this: E0308).
# A registry version + one workspace-root [patch.crates-io] is the form that
# actually unifies, because the patch rewrites every edge at once.
zenanalyze-api = { version = "0.1.0", optional = true }
serde_json = { version = "1.0", default-features = false, features = ["std"], optional = true }
almost-enough = { version = "0.4.3", default-features = false }
# zencodec trait integration is always built (the `codec` module implementing
# Encoder/Decoder + the `CategorizedError` taxonomy), so this is a hard dep.
zencodec = { version = ">=0.1.26, <0.3.0" }
# Gain-map application math for GainMapRender::ReconstructHdr (decode-side
# HDR reconstruction). Pure math, no codec engines. Used unconditionally by the
# (now always-built) `codec` module, so it is a hard dep too.
ultrahdr-core = { version = "0.5.0", default-features = false }
# zennode = { path = "../zennode/zennode", optional = true, default-features = false, features = ["derive"] }
zenpixels = { version = ">=0.2.16, <0.4.0", default-features = false, features = ["imgref", "rgb"] }
zenpixels-convert = { version = ">=0.2.16, <0.4.0", default-features = false, features = ["rgb", "hdr-experimental"] }
linear-srgb = { version = "0.6.7"}

[dev-dependencies]
# Raw-frame capture + lazy symbolization for the per-site allocation profiler
# in examples/mem_probe_encode.rs (JXL_ALLOC_SITES=1; ported from zenjxl).
backtrace = "0.3.76"
almost-enough = { version = "0.4.3", features = ["alloc"] }
# Retained for the pending migration of `tests/fuzz_regression.rs`. The
# published 0.1.0 `RegressionSuite::run()` treats a missing or empty seed
# directory as a silent no-op, so the harness carries a local stand-in with the
# `min_seeds` / `RegressionReport` seed-expectation API instead. When that API
# publishes, delete the harness's `regress` module and restore the import — the
# builder chain is already written in its shape.
zenutils-fuzz = "0.1.0"
# `testable_dispatch` is what lets a test disable a token that the target
# baseline guarantees at COMPILE time (NEON on aarch64, SSE2 on x86-64):
# without it `incant!` can never fall below the host's best tier and the
# scalar/lower-tier kernel copies are unreachable from any test. The
# cross-tier parity test in src/yuv_convert.rs asserts the disable actually
# took effect (CompileTimePolicy::Fail), so removing this feature fails the
# test loudly instead of silently testing one tier twice.
archmage = { version = "0.9.15", features = ["std", "testable_dispatch"] }
env_logger = { version = "0.11.10", default-features = false }
png = "0.18.0"
image = "0.25.10"
zenbench = { version = "0.1.2", features = ["criterion-compat"] }
fast-ssim2 = { version = "0.8.0", features = ["imgref"] }
zensim = { git = "https://github.com/imazen/zensim", branch = "main", features = ["imgref", "zenpixels", "feature-regime-v2", "custom-profiles"] }
# zensim-regress must track the SAME zensim as the dependency above, or the
# `Zensim` / `ImageSource` types in tests/linku_corpus.rs come from two
# different zensim crates and don't unify. Registry 0.3.1 depends on zensim
# 0.2.x; git `main` (0.4.0) depends on 0.3.0. Unpin together at the publish.
zensim-regress = { git = "https://github.com/imazen/zensim", branch = "main" }
# NOTE (merge of origin/main, 2026-08-11): main carried a second, RENAMED
# `zensim03` path dep so the `zensim_cq_rd` harness could reach 0.3.0's
# `ZensimProfile::C` while the main dep stayed pinned to registry 0.2.4.
# This branch's `zensim` is git `main` and already enables the two features
# that alias existed for (`custom-profiles`, `feature-regime-v2`), so the
# alias is redundant here and was dropped — which is exactly the collapse
# main's own comment asked for (zensim#46). `zensim_cq_rd.rs` now uses the
# plain `zensim` crate. Both deps must keep tracking the SAME zensim.
rayon = "1.11.0"
# Feature extraction for the rav1e knob predictor MLP training.
# Path-pinned to the sibling checkout (see the [dependencies] note above);
# test-only dep for the rav1e picker training.
zenanalyze = { version = "0.2.0", path = "../zenanalyze", features = ["experimental"] }
# Parses `cargo metadata` in tests/public_api_doc.rs (feature-list discovery).
serde_json = "1.0.150"
# Crafted-container regressions (tests/sweep_40_geometry.rs) mux mismatched
# AV1 payloads that no encoder would produce. Must match the optional normal
# dep's source exactly (cargo requires one canonical path per dep name).
zenavif-serialize = { version = "0.2.0" }

