[features]
default = ["avx512"]
# AVX-512 kernel tiers (v4x/v4) for the in-house YUV converters — safe,
# runtime-dispatched (used only when the CPU reports support). Default-on;
# opt out with default-features = false for minimal builds.
avx512 = ["archmage/avx512"]
# EXPERIMENTAL: zenav1-aom (`aom-decode`) as a second AV1 KEY-frame decode
# backend behind `decode_av1_obu_yuv(.., Av1Backend::AomRs)`. KEY-frame /
# intra scope only (an AVIF still is a single KEY frame); byte-identical to
# libaom on the intra conformance corpus. Off by default; also drives the
# 4-way decode benchmark example.
aom-backend = ["dep:aom-decode"]
# Decode with hand-written assembly via C FFI (fastest, uses unsafe)
unsafe-asm = ["dep:rav1d", "rav1d/asm"]
# AVIF encoding via zenravif (pure Rust by default)
encode = ["dep:ravif"]
# Precise perceptual-quality targeting: encode->decode->score convergence on
# a requested SSIMULACRA2 / zensim score (encode_rgb8_with_target).
target-quality = ["encode", "dep:fast-ssim2", "dep:zensim"]
# Butteraugli-diffmap-guided second pass (spatial closed loop): encode,
# decode, pool the per-pixel butteraugli map per 64×64 superblock, re-encode
# with per-SB quantizer scaling (encode_rgb8_two_pass). Pulls zenravif's
# `__expert` passthrough internally without exposing zenavif's own
# `__expert` surface. RELEASE-GATED at runtime behind
# `zenravif::FRAME_HINTS_LIVE` (fails honestly until the zenrav1e dep bump).
two-pass-butteraugli = ["encode-imazen", "ravif/__expert", "dep:butteraugli"]
# zensim-diffmap-driven closed loop (encode_rgb8_zensim_loop): encode ->
# decode -> Zensim::compute_with_ref_and_diffmap -> global quality correction
# from the score AND per-64x64-superblock quantizer scales from the diffmap
# -> re-encode. Unlike `two-pass-butteraugli` (purely spatial, and so
# refused outright while zenravif's FrameHints passthrough is release-gated),
# this loop's GLOBAL half is live today; the spatial half is applied only
# when `zenravif::FRAME_HINTS_LIVE`, reported per call as
# `ZensimLoopResult::spatial_applied`. Builds on `target-quality` (shares
# the search, the q0 seed, and the zensim dep).
two-pass-zensim = ["target-quality", "encode-imazen", "ravif/__expert"]
# EXPERIMENTAL: AVIF encoding via svtav1-rs (pure Rust SVT-AV1 port,
# imazen/svtav1 branch dep). Adds the working `Av1Backend::SvtRs` variant:
# 8-bit 4:2:0 stills only, dimensions must be multiples of 64 (the svtav1-rs
# pipeline codes full 64x64 superblocks; no partial-SB / container-crop path
# yet). Bitstream identity vs C-SVT is NOT yet asserted — that parity gate
# lands when svtav1-rs reaches decision-layer bitstream identity. Off by
# default; requires `encode` (the backend enum and entry points live there).
encode-svt-rs = ["encode", "dep:svtav1", "dep:zenavif-serialize"]
# Encoding with hand-written assembly (fastest, uses unsafe)
encode-asm = ["encode", "ravif/asm"]
# Encoding with multi-threading
encode-threading = ["encode", "ravif/threading"]
# Encoding with imazen/zenrav1e fork features (QM, VAQ, still-image tuning, lossless)
encode-imazen = ["encode", "ravif/imazen"]
# True monochrome (Cs400) encode for Gray8 input: encode_gray8 routes through
# zenravif's Encoder::encode_gray8 (luma-only bitstream — chroma RDO skipped,
# measured 2-3x faster at byte parity; imazen/zenavif#6). TEMPORARY GATE:
# requires zenravif with encode_gray8 (imazen/cavif-rs main >= 89668f13, which
# CI's clone-siblings provides). Fold into `encode` once local sibling
# checkouts are past the speed-ladder dev-patch / at the next zenravif bump.
encode-mono = ["encode"]
# Expert / unstable: exposes `InternalParams` for codec calibration sweeps
# + the rav1e knob predictor MLP training pipeline. Double-underscore prefix
# signals "private — do not depend on this in production code." Anything
# in the `expert` module may change without semver bumps. Pulls zenravif's
# `__expert` feature for the underlying speed-preset overrides.
__expert = ["encode-imazen", "ravif/__expert"]
# Auto-tune via the rav1e knob predictor MLP. Includes a baked ZNPR
# model + zenanalyze feature extractor; adds ~30 KB to the binary.
# See docs/RAV1E_PICKER_PLAN.md for the training pipeline.
auto-tune = ["encode-imazen", "dep:zenpredict", "dep:zenanalyze", "dep:zenanalyze-api", "dep:serde_json"]
# Enable zennode pipeline node definitions
# zennode = ["dep:zennode"]
# Expose internal YUV conversion modules for profiling/debugging. Not public API.
_dev = ["archmage/testable_dispatch"]

[profile.test]
opt-level = 2

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition"]

