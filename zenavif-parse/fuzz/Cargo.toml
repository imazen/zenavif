[package]
name = "zenavif-parse-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace root: root `workspace.exclude` does not reach a
# package nested inside a member directory (zenavif-parse/ is a member),
# so without this table cargo errors "believes it's in a workspace".
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
enough = "0.4"

[dependencies.zenavif-parse]
path = ".."

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_limited"
path = "fuzz_targets/fuzz_parse_limited.rs"
test = false
doc = false
bench = false

# This standalone workspace inherits no parent patches.
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "3a10011b6b05d2269e29db5e40db71888d0fcfce" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "9686936bfa49df370a1e71666b252b9f48f744b4" }
