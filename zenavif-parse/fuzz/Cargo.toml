[package]
name = "zenavif-parse-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace root: root `workspace.exclude` does not reach a
# package nested inside a member directory (zenavif-parse/ is a member),
# so without this table cargo errors "believes it's in a workspace".
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
enough = "0.4"

[dependencies.zenavif-parse]
path = ".."

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_limited"
path = "fuzz_targets/fuzz_parse_limited.rs"
test = false
doc = false
bench = false

# This standalone workspace inherits no parent patches.
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "5d4f6c473404c09c95f404543f8a16a1e3cb8477" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "7fa068834f8074c2630a352b25f355f7c90751f8" }
