[package]
name = "zenavif-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace root: keeps this package out of the repo workspace
# (required for the [patch] mirror below to apply, and — for the
# zenavif-parse twin — root `workspace.exclude` does not reach a package
# nested inside a member directory).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
enough = "0.4"
# The negotiation fuzzer drives the zencodec adapter (the other targets use
# the native `decode_with` entry point, which never reaches negotiation).
zencodec = ">=0.2.0, <0.4.0"
zenpixels = ">=0.2.16, <0.4.0"

[dependencies.zenavif]
path = ".."
features = ["inventory"]

[patch.crates-io]
# Keep standalone consumers on the same optional-control family.
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "c6df5d5eb589b20585ad13cd57ce5a4158aa656e" }
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "c6df5d5eb589b20585ad13cd57ce5a4158aa656e" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "c6df5d5eb589b20585ad13cd57ce5a4158aa656e" }
zencodec-media = { git = "https://github.com/imazen/zencodec", rev = "c6df5d5eb589b20585ad13cd57ce5a4158aa656e" }
zencodec-media-testkit = { git = "https://github.com/imazen/zencodec", rev = "c6df5d5eb589b20585ad13cd57ce5a4158aa656e" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "c6df5d5eb589b20585ad13cd57ce5a4158aa656e" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "7e9d296c9e037e626234c9f0e8673d48278f83f0" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
# fuzz/ is its own workspace root, so the root [patch] does not reach it.
# zenavif-parse needs no mirror: zenavif's dep on it is a path dep into the
# workspace (zenavif-parse/), which resolves transitively from here.
# Mirror of the root rav1d-safe git pin (0.6.0-staged; zenavif#30 wedge fix +
# the #524 loop-filter H-window fix). Keep it in lockstep with the root
# manifest's `rev` — the reasoning for the current one lives there. Drop at
# the rav1d-safe 0.6.0 release.
rav1d-safe = { git = "https://github.com/imazen/rav1d-safe", rev = "b19aec6561204ff310250bf2bc1b2c6faa42c3b5" }
# Mirror of the root zencodec pin: ultrahdr-core reaches zencodec through
# zenmeta at this exact rev, so any other rev splits the graph into two
# zencodec copies (gain_map.rs then fails to typecheck).
zencodec = { git = "https://github.com/imazen/zencodec", rev = "c6df5d5eb589b20585ad13cd57ce5a4158aa656e" }

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_animation"
path = "fuzz_targets/fuzz_decode_animation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_limited"
path = "fuzz_targets/fuzz_decode_limited.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_negotiate"
path = "fuzz_targets/fuzz_decode_negotiate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/fuzz_inventory.rs"
test = false
doc = false
bench = false
