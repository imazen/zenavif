[package]
name = "zenavif-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace root: keeps this package out of the repo workspace
# (required for the [patch] mirror below to apply, and — for the
# zenavif-parse twin — root `workspace.exclude` does not reach a package
# nested inside a member directory).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
enough = "0.4"
# The negotiation fuzzer drives the zencodec adapter (the other targets use
# the native `decode_with` entry point, which never reaches negotiation).
zencodec = ">=0.1.26, <0.3.0"
zenpixels = ">=0.2.16, <0.4.0"

[dependencies.zenavif]
path = ".."
features = ["inventory"]

[patch.crates-io]
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "3c8e2cb20e9cebfb877b53300c188c2e98bf2e49" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "2031094449ad1177ff96461d7c4d586c7ed384e6" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "0d74f5eb91d985b877d92210020bb96f233fcc0b" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "0d74f5eb91d985b877d92210020bb96f233fcc0b" }
# fuzz/ is its own workspace root, so the root [patch] does not reach it.
# zenavif-parse needs no mirror: zenavif's dep on it is a path dep into the
# workspace (zenavif-parse/), which resolves transitively from here.
# Mirror of the root rav1d-safe git pin (0.6.0-staged; zenavif#30 wedge fix +
# the #524 loop-filter H-window fix). Keep it in lockstep with the root
# manifest's `rev` — the reasoning for the current one lives there. Drop at
# the rav1d-safe 0.6.0 release.
rav1d-safe = { git = "https://github.com/imazen/rav1d-safe", rev = "dfd01e3268f6e8da862d2d5f0a71d19f414f2b87" }
# TEMPORARY: the structural-inventory API branch (imazen/zencodec#133);
# swap for the released zencodec before merge.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "a31a9b680e54d5fea555c44b0d70c65802087df3" }

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_animation"
path = "fuzz_targets/fuzz_decode_animation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_limited"
path = "fuzz_targets/fuzz_decode_limited.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_negotiate"
path = "fuzz_targets/fuzz_decode_negotiate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/fuzz_inventory.rs"
test = false
doc = false
bench = false
