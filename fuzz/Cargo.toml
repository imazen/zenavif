[package]
name = "zenavif-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace root: keeps this package out of the repo workspace
# (required for the [patch] mirror below to apply, and — for the
# zenavif-parse twin — root `workspace.exclude` does not reach a package
# nested inside a member directory).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
enough = "0.4.5"
# The negotiation fuzzer drives the zencodec adapter (the other targets use
# the native `decode_with` entry point, which never reaches negotiation).
zencodec = ">=0.3.0, <0.5.0"
zenpixels = ">=0.5.0, <0.6.0"

[dependencies.zenavif]
path = ".."
features = ["inventory"]

[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
# Keep standalone consumers on the same optional-control family.
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "093211c276fbb1781bec1601d7cb6b0fb92f245a" }
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "093211c276fbb1781bec1601d7cb6b0fb92f245a" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "093211c276fbb1781bec1601d7cb6b0fb92f245a" }
zencodec-media = { git = "https://github.com/imazen/zencodec", rev = "093211c276fbb1781bec1601d7cb6b0fb92f245a" }
zencodec-media-testkit = { git = "https://github.com/imazen/zencodec", rev = "093211c276fbb1781bec1601d7cb6b0fb92f245a" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "093211c276fbb1781bec1601d7cb6b0fb92f245a" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "a9e3eabc0884b03d2d0ef22627b1b41c03b09589" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "e0dba0052a839ecfe17e4c911a3761e793605adf" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "e0dba0052a839ecfe17e4c911a3761e793605adf" }
# Research dependencies still require the earlier pixel API.
zenpixels-03 = { package = "zenpixels", git = "https://github.com/imazen/zenpixels", rev = "fa836abf72afe9826e866dc25712b7c800323962" }
zenpixels-convert-03 = { package = "zenpixels-convert", git = "https://github.com/imazen/zenpixels", rev = "fa836abf72afe9826e866dc25712b7c800323962" }
# fuzz/ is its own workspace root, so the root [patch] does not reach it.
# zenavif-parse needs no mirror: zenavif's dep on it is a path dep into the
# workspace (zenavif-parse/), which resolves transitively from here.
# Mirror of the root rav1d-safe git pin (0.6.0-staged; zenavif#30 wedge fix +
# the #524 loop-filter H-window fix + #536 non-x86_64 incant import). Keep it
# in lockstep with the root manifest's `rev` — the reasoning for the current
# one lives there. Drop at the rav1d-safe 0.6.0/0.7.0 release.
rav1d-safe = { git = "https://github.com/imazen/rav1d-safe", rev = "1c1377c44136770483af55770088a68f54bc87cd" }
# Mirror of the root zencodec pin: ultrahdr-core reaches zencodec through
# zenmeta at this exact rev, so any other rev splits the graph into two
# zencodec copies (gain_map.rs then fails to typecheck).
zencodec = { git = "https://github.com/imazen/zencodec", rev = "093211c276fbb1781bec1601d7cb6b0fb92f245a" }

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_probe"
path = "fuzz_targets/fuzz_probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_animation"
path = "fuzz_targets/fuzz_decode_animation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_limited"
path = "fuzz_targets/fuzz_decode_limited.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decode_negotiate"
path = "fuzz_targets/fuzz_decode_negotiate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory"
path = "fuzz_targets/fuzz_inventory.rs"
test = false
doc = false
bench = false
