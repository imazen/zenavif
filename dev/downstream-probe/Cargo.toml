# The stand-in for `cargo semver-checks`, which cannot run on this crate.
#
# An OUT-OF-CRATE consumer of zenavif, in its OWN [workspace] so it never joins
# the parent (a `path` dep back to the parent from a member would be circular).
# Two things it catches that a same-crate test cannot:
#
#   1. `#[non_exhaustive]` — in-crate matches are unaffected by it, so only a
#      separate crate proves the break shape. Every wildcard arm in `main.rs`
#      is a change a downstream consumer must make.
#   2. A refusal message that names the WRONG feature or backend. That defect
#      (`Av1Backend::Zenav1Aom does not support encode_rgb16 (requires the
#      zenav1-svt cargo feature)`) shipped on 2026-09-02 and was caught by
#      compiling a real consumer, not by a same-crate test.
#
# Usage (share the parent's target dir so this costs seconds, not gigabytes):
#   CARGO_TARGET_DIR=../../target cargo run --release
#
# The `[patch.crates-io]` table below is NOT optional and is NOT new in 0.2.0:
# `[patch]` tables in a dependency's own manifest are ignored, so the parent's
# root patch table does not reach a consumer. Any consumer of zenavif needs
# these entries until zenavif-serialize 0.2.0, zenanalyze-api 0.1.1 and the
# zencodec / zenpixels releases carrying the pinned APIs publish.
[package]
name = "zenavif-downstream-probe"
version = "0.0.0"
edition = "2024"
publish = false
# Two binaries: the probe (what CI runs) and `emit`, which writes AVIFs for an
# EXTERNAL decoder to read. Without `default-run` a bare `cargo run` is
# ambiguous and the CI step would fail on the second binary being added.
default-run = "zenavif-downstream-probe"

[workspace]

[features]
queue-audit = ["zenavif/media-encode", "dep:zencodec", "dep:zencodec-media", "dep:zenpixels", "dep:enough", "dep:zenrav1e"]

[[bin]]
name = "queue_audit"
path = "src/bin/queue_audit.rs"
required-features = ["queue-audit"]

[dependencies]
zencodec = { version = "0.1.27", optional = true }
zencodec-media = { git = "https://github.com/imazen/zencodec", rev = "7cc3d3ec6b41103ee8398c30b1582ebdbb6df914", optional = true }
zenpixels = { version = "0.2.17", optional = true }
enough = { version = "0.4.5", optional = true }
zenrav1e = { version = "0.2.0", git = "https://github.com/imazen/zenrav1e", rev = "9057c4bacf1d8a23974e32de09fd4446a1cc525a", default-features = false, optional = true }
zenavif = { path = "../..", features = ["encode", "zenav1-aom-encode"] }
imgref = "1.11.0"
rgb = "0.8.52"
almost-enough = { version = "0.4.3", features = ["alloc"] }

[patch.crates-io]
zenpredict = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "8c9b9a87460116d45d1e58afd8058002b083c4a6" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "10a79c3a888dd589884fd032846eec70bc31eb13" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "1d3ddd2131b22e9e3754c765d4ce45ce3901de59" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "1d3ddd2131b22e9e3754c765d4ce45ce3901de59" }
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze", rev = "6bbcacb11313923ded6e5eeebb725878c5736453" }
zenavif-serialize = { path = "../../zenavif-serialize" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "7cc3d3ec6b41103ee8398c30b1582ebdbb6df914" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "7cc3d3ec6b41103ee8398c30b1582ebdbb6df914" }

[patch."https://github.com/imazen/zenavif"]
zenavif-serialize = { path = "../../zenavif-serialize" }
