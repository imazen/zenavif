# The stand-in for `cargo semver-checks`, which cannot run on this crate.
#
# An OUT-OF-CRATE consumer of zenavif, in its OWN [workspace] so it never joins
# the parent (a `path` dep back to the parent from a member would be circular).
# Two things it catches that a same-crate test cannot:
#
#   1. `#[non_exhaustive]` — in-crate matches are unaffected by it, so only a
#      separate crate proves the break shape. Every wildcard arm in `main.rs`
#      is a change a downstream consumer must make.
#   2. A refusal message that names the WRONG feature or backend. That defect
#      (`Av1Backend::Zenav1Aom does not support encode_rgb16 (requires the
#      zenav1-svt cargo feature)`) shipped on 2026-09-02 and was caught by
#      compiling a real consumer, not by a same-crate test.
#
# Usage (share the parent's target dir so this costs seconds, not gigabytes):
#   CARGO_TARGET_DIR=../../target cargo run --release
#
# The `[patch.crates-io]` table below is NOT optional and is NOT new in 0.2.0:
# `[patch]` tables in a dependency's own manifest are ignored, so the parent's
# root patch table does not reach a consumer. Any consumer of zenavif needs
# these entries until zenavif-serialize 0.2.0, zenanalyze-api 0.1.1 and the
# zencodec / zenpixels releases carrying the pinned APIs publish.
[package]
name = "zenavif-downstream-probe"
version = "0.0.0"
edition = "2024"
publish = false
# Two binaries: the probe (what CI runs) and `emit`, which writes AVIFs for an
# EXTERNAL decoder to read. Without `default-run` a bare `cargo run` is
# ambiguous and the CI step would fail on the second binary being added.
default-run = "zenavif-downstream-probe"

[workspace]

[features]
queue-audit = ["zenavif/media-encode", "dep:zencodec", "dep:zencodec-media", "dep:zenpixels", "dep:zenrav1e"]
color-qualify = ["dep:zencodec", "dep:zenpixels", "dep:zenpixels-convert", "dep:zenavif-serialize"]
icc-db = ["color-qualify", "zenpixels-convert/icc-db"]

[[bin]]
name = "queue_audit"
path = "src/bin/queue_audit.rs"
required-features = ["queue-audit"]

[[bin]]
name = "color_gray"
path = "src/bin/color_gray.rs"
required-features = ["color-qualify"]

[dependencies]
zencodec = { version = ">=0.3.0, <0.5.0", optional = true }
zencodec-media = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54", optional = true }
zenpixels = { version = ">=0.5.0, <0.6.0", optional = true }
zenpixels-convert = { version = ">=0.5.0, <0.6.0", default-features = false, optional = true }
zenavif-serialize = { path = "../../zenavif-serialize", optional = true }
zenrav1e = { version = "0.2.0", git = "https://github.com/imazen/zenrav1e", rev = "9057c4bacf1d8a23974e32de09fd4446a1cc525a", default-features = false, optional = true }
zenavif = { path = "../..", features = ["encode", "zenav1-aom-encode"] }
imgref = "1.12.3"
rgb = "0.8.53"
almost-enough = { version = "0.4.5", features = ["alloc"] }

[patch.crates-io]
garb = { git = "https://github.com/imazen/garb", rev = "457ff8b9153e9d675a39dc098052b2ffeb6206fa" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "ae83f19426737635fee3dd16f228681019f52585" }
# Keep standalone consumers on the same optional-control family.
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54" }
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54" }
zencodec-media = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54" }
zencodec-media-testkit = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54" }
zenflate = { git = "https://github.com/imazen/zenflate", rev = "7270e38faca9cdbae793938fa229d40ac4fe4c39" }
zenpredict = { git = "https://github.com/imazen/zenanalyze", rev = "9f57f1be05e49f91d7a13f5a4bc1227b56fe76f2" }
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "9f57f1be05e49f91d7a13f5a4bc1227b56fe76f2" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "c55a2ff702d765312d7855bcb6ab477c5f24363d" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "5bc640c6adcd358587ab70b6645fa4e19da31af5" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "d40a957e95d19ea3fb5c29472820c86e8a34b09e" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "d40a957e95d19ea3fb5c29472820c86e8a34b09e" }
# Research dependencies still require the earlier pixel API.
zenpixels-03 = { package = "zenpixels", git = "https://github.com/imazen/zenpixels", rev = "fa836abf72afe9826e866dc25712b7c800323962" }
zenpixels-convert-03 = { package = "zenpixels-convert", git = "https://github.com/imazen/zenpixels", rev = "fa836abf72afe9826e866dc25712b7c800323962" }
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze", rev = "9f57f1be05e49f91d7a13f5a4bc1227b56fe76f2" }
zenavif-serialize = { path = "../../zenavif-serialize" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "26326a6e1ab59086c7f8683eb27f4c8e054d5e54" }

[patch."https://github.com/imazen/zenavif"]
zenavif-serialize = { path = "../../zenavif-serialize" }
